# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Review policy for saga, derived by the coderabbit-config skill.
# Each instruction names the skill it comes from; `policy` is the review policy
# of coderabbit-config itself, and `repository` marks a rule beyond the catalog.
#
# Catalogs read:
#   practice catalog (not public)  a56636a4eed7a0d644b89f5bb7c7d7c9692e0887
#   gleam-agent-tools  d7b541cb885b3edbf25563b06aee97b28b66074f
#
# Governing skills: coderabbit-config (policy), gleam, gleam-lib, gleam-ffi,
# gleam-otp, saga, sinal, json-blueprint, gleam-sql, testing, elixir, design,
# tracker, gate, git.
language: en-US
tone_instructions: >-
  Literal and concise. Report only defects you can evidence from the diff, its
  callers, the design, or a cited rule. One finding per cause. An empty review
  is valid.
early_access: false

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  high_level_summary_instructions: |
    Lead with the problem the change solves, then the response in one short
    paragraph, then the public API, durability or recovery effect, if any. Do
    not narrate the diff file by file.
  review_status: true
  commit_status: true
  fail_commit_status: true
  collapse_walkthrough: true
  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false
  assess_linked_issues: true
  related_issues: true
  related_prs: false
  suggested_labels: false
  suggested_reviewers: false
  auto_assign_reviewers: false
  poem: false
  in_progress_fortune: false
  enable_prompt_for_ai_agents: true

  auto_review:
    enabled: true
    drafts: false
    auto_incremental_review: true
    base_branches:
      - main

  # Rendered design documents and lock files.
  path_filters:
    - "!flake.lock"
    - "!oracle/reactor/mix.lock"
    - "!docs/design/design-layer.pdf"
    - "!integrations/saga_postgres/docs/design/design-layer.pdf"

  path_instructions:
    - path: "{src,examples/*/src,integrations/*/src}/**"
      instructions: |
        Review policy (policy).
        - Design first. docs/COVERAGE.md maps each part to its owning section
          in docs/design (contexts `execution` and `durability`) and docs/adr;
          integrations/saga_postgres has its own layer and COVERAGE.md. Flag
          code that contradicts that unit's interface, invariants or side
          effects, and a change to designed behavior with no change to its
          design. A fix that restores designed behavior needs none. When code
          and design disagree, the design changes first.
        - Core abstractions. Flag a second representation of a concept the
          design names (workflow, step, port, execution, local run, attempt,
          effect key, compensation, undo, settlement, unknown effect, outcome,
          hold, checkpoint, storage, claim, revision, resolver, drive, lease),
          a name that differs from the CONTEXT.typ glossaries, and a public
          module, the consumer or the PostgreSQL adapter reaching into
          `saga/internal` past the interface that owns it.
        - Lean. Flag code no test, caller or unit needs: an unset option, an
          unvaried parameter, a wrapper that adds no rule, an unreachable
          branch. Say what to delete.
        - Migration, never a legacy path. Flag a compatibility shim, a
          fallback to an old checkpoint or row format, a dual read or write, a
          deprecated alias, and a flag that keeps old behavior. A change to a
          public module ships as a breaking release with a migration note.
        - Composable. In a public module, flag hidden call ordering, global
          state, a mandatory framework where functions compose, a concept the
          common caller must learn and does not need, and a module with two
          responsibilities.
        - Test first. Flag a behavior change with no test that exercises it,
          and a test bound to internals.
        - Typed before foreign. Flag Erlang where Gleam does the job, an
          unchecked cast, an untyped stored value that reaches domain logic
          undecoded, and a crash on a routine failure.
        - Silence. Report nothing that `gleam format`, the compiler with
          warnings as errors, `erlc -Werror`, scripts/check_negative.sh, the
          tests or scripts/test.sh decide, and no layout or naming preference
          without a written rule.

    - path: "{src,test,examples,bench,integrations/*/src,integrations/*/test}/**/*.gleam"
      instructions: |
        Gleam (gleam).
        - Flag a module function, private included, without annotated
          arguments and return type, and an imported function or constant used
          unqualified.
        - Flag a name against the conventions: acronyms as words (`Json`,
          `Sql`), conversions named `x_to_y` or `to_y` inside module `x`,
          `try_` only for an error-propagating counterpart.
        - Flag `Option` carrying a failure, and a change that merges omitted,
          explicit false, empty and failed where they mean different things.
        - Flag an error a caller must parse as a string to choose recovery.
        - Flag independent optional fields or booleans standing for exclusive
          states; they are variants.
        - Flag a predicate check followed by `let assert` on the same shape,
          and a catch-all branch that silently accepts a new variant.
        - Flag `panic` or `let assert` handling a routine step, storage or
          decoding failure in `src/` or an adapter's `src/`.
        - Flag a refactor that changes observable errors, ordering or effects.
        - Flag a compatibility branch with no comment saying why it exists.
        - Flag `src/` importing a `test/` module or `gleeunit`.
        - Flag a new process, module or generic machinery added only for
          organization, and a local type replacing a compatible ecosystem type.

    - path: "{src,integrations/*/src}/**/*.gleam"
      instructions: |
        Published library surface (gleam-lib). Exported constructors, fields,
        variants, module paths and behavior of non-internal modules are the
        compatibility surface; `internal_modules` in each gleam.toml marks
        instability, not access control.
        - Flag a removed or changed export, variant, field or behavior in a
          public module that the pull request does not call breaking.
        - Flag an opaque type (port, effect key, execution) made public or
          given a constructor; fixtures/negative proves these cannot be built
          by callers.
        - Flag a public signature that exposes an implementation-state type
          parameter.
        - Flag an argument that does not affect behavior, a setter per field
          where a record update works, and two public paths for one common
          task.
        - Flag configuration validated after a resource is allocated, and a
          builder or extension protocol with no distinct use case.
        - Flag a dynamic dispatcher over heterogeneous parameters where typed
          ports can be bound, such as a result map keyed by step name.
        - Flag a deliberate crash on a failure the caller could act on; return
          a structured error instead.
        - Flag the library taking over policy the application owns: external
          clients, business decisions, wakeups, unfinished-run discovery and
          redelivery.
        - Flag saga itself depending on pog; the adapter is a separate
          package (AGENTS.md).

    - path: "examples/*/src/**/*.gleam"
      instructions: |
        Public consumer (gleam-lib; AGENTS.md).
        - Flag an import of `saga/internal`; the consumer imports only public
          modules.
        - Flag a usage module under `order_consumer/usage/` that no longer
          shows the common path, a customization and an expected failure for
          the API it documents.

    - path: "{src,test,examples,bench,integrations/*/src,integrations/*/test}/**/*.{gleam,erl}"
      instructions: |
        Foreign boundaries (gleam-ffi). Apply to `*.erl` files and to a Gleam
        module that declares `@external`.
        - Flag validation, branching or state transitions in foreign code,
          such as checkpoint or storage decisions in saga_checkpoint.erl or
          saga_storage.erl; it performs the native call and the
          representation conversion only.
        - Flag an external that declares a native value to be a checked domain
          value, `Dynamic` or a type variable that accepts every handle, and a
          generic return that hides an unchecked cast.
        - Flag an Erlang function whose actual return (an `{error, _}` tuple,
          an atom, an exception) the declared Gleam type does not describe.
        - Flag an expected native failure not mapped to the declared failure
          value, and code that assumes Gleam catches a foreign exception.
        - Flag a cancellation or timeout treated as proof that an effect
          never happened.
        - Flag a foreign function with no remaining caller.

    - path: "{src,examples/*/src,integrations/*/src}/**/*.gleam"
      instructions: |
        Processes (gleam-otp). Apply to a module that imports `gleam/otp` or
        `gleam/erlang/process`.
        - Flag an actor whose messages are not one explicit message type, and
          request/reply mechanics exposed instead of hidden behind public
          functions.
        - Flag a step callback, storage write or other slow effect run inside
          the coordinator, which must stay responsive to cancellation and
          completion messages.
        - Flag accepted work, active steps or waiting messages with no bound.
        - Flag code that treats `process.call` as returning a timeout `Error`;
          it panics on timeout, callee exit or a missing name.
        - Flag a call timeout that triggers an unconditional retry of a step
          effect.
        - Flag a message, spawn closure or start argument that captures a
          whole workflow, environment or codec where an id or a small value
          would do.
        - Flag an atom or process name built from run input.
        - Flag links, monitors and supervision used interchangeably, and a
          restarted coordinator assumed to have restored business state.
        - Flag an actor introduced only to organize functions.

    - path: "src/**/*.gleam"
      instructions: |
        Saga contract (saga).
        - Flag a `define` builder that runs more than once per definition, or
          that reads request-specific state; run input arrives at execution.
        - Flag a timeout or cancellation alone used to replay, undo or
          compensate a step; an unknown effect needs authoritative evidence.
        - Flag an `EffectKey` or idempotency key that changes between
          attempts, recovery or reconnects of one execution.
        - Flag `undo` and `compensate` merged; undo reverses known completed
          work, compensation decides retry, replacement, abort or hold.
        - Flag recovery that restores an interrupted action without
          `Completed` evidence, treats `NotSent` as proven without evidence,
          or resumes past `MaybeSent` instead of suspending.
        - Flag a terminal report that drops cleanup failures or unknown-effect
          evidence, and `outcome.summary` used in place of the report.
        - Flag durable storage that starts a permanent scheduler, and a drive
          timeout that cancels saved execution.
        - Flag an application commit and a checkpoint commit claimed atomic.
        - Flag file storage that accepts a relative or non-canonical
          directory, or claims power-loss durability for the directory.
        - Flag `await` on a `start_reporting` handle returning anything but
          `NotOwner`, and an owner-loss path that lets `rollback_within` bound
          total execution.
        - Flag a `CoordinatorCrashed` cause reported as a known failure; it is
          uncertain.
        - Flag a `Config` or step bound beyond about 49.7 days accepted
          instead of failing as `DurationTooLong`, or at `define` as
          `InvalidTimeout`, and `execution.Infinity` lifting anything but the
          run deadline and the default step timeout.

    - path: "{examples/*/src/**/*.gleam,bench/src/**/*.gleam,README.md}"
      instructions: |
        Saga consumer (saga). Apply to Gleam code in the example consumer,
        the benchmark and README.md excerpts.
        - Flag a workflow defined per request instead of once with `define`,
          and request-specific state captured in the builder.
        - Flag step names used as an untyped result dictionary instead of
          typed ports with `perform`, `both`, `all` and `choose`.
        - Flag an external effect without `effect` and its `EffectKey` sent
          as the provider's idempotency key, and a possibly completed failure
          without `unknown_when` and an explicit uncertainty policy.
        - Flag a refund, release or retry of a possibly completed effect
          without evidence, and a `CoordinatorCrashed` cause treated as a
          known failure.
        - Flag `outcome.summary` used for a decision instead of display.
        - Flag a `Config` or step bound beyond about 49.7 days.
        - Flag an unfinished `start` handle dropped without `cancel` and
          `await`, and a `start_reporting` caller that neither receives the
          terminal report nor monitors the coordinator.
        - Flag a durable run started with a new execution ID per delivery,
          and `start_or_reconnect` with a different definition or encoded
          input for one ID.
        - Flag an interrupted callback retried because no checkpoint exists.
        - Flag memory or file storage used where the failure model needs runs
          to survive the VM or span nodes.

    - path: "integrations/*/src/**/*.gleam"
      instructions: |
        Saga storage adapter (saga; integrations/saga_postgres/AGENTS.md).
        - Flag pool startup, shutdown, an ambient scheduler or a shared
          durability runtime added to the adapter; the application owns the
          pool.
        - Flag a retained transaction-scoped connection where a pooled handle
          is needed.
        - Flag replay safety of an external effect inferred from a lease or
          revision fence.
        - Flag effects and checkpoints claimed atomic because they share a
          pool.

    - path: "{integrations/*/src/**/*.gleam,integrations/*/priv/migrations/*.sql}"
      instructions: |
        PostgreSQL access (gleam-sql).
        - Flag a value interpolated into SQL text instead of bound as a
          parameter, and an identifier (the schema name) not fixed by trusted
          configuration.
        - Flag a query inside a transaction that uses the pool instead of the
          callback's transaction connection, and a failure replaced by
          success.
        - Flag a decoding failure after a write treated as proof that the
          write did not happen.
        - Flag an invariant against concurrent writers enforced only by an
          application check where a constraint or lock is needed.
        - Flag an edit to a released migration step; add a new numbered
          migration with up, down and end sections instead.
        - Flag a migration that sets `disable_transaction` while the change
          claims its steps commit together.

    - path: "examples/*/src/**/*.gleam"
      instructions: |
        JSON Blueprint codecs (json-blueprint). Apply to a module that imports
        `json/blueprint`.
        - Flag a change to a union envelope (`tag`/`value`) in a change that
          claims checkpoint compatibility.
        - Flag a callback passed to `field`, `optional_field`, `success` or a
          getter that has an effect or is not synchronous and pure, and a
          placeholder value from schema discovery stored as data.
        - Flag a change that merges omission, null and a value; over
          `nullable`, `optional_field` yields `None`, `Some(None)` and
          `Some(Some(value))`.
        - Flag a definition derived at run time and used without
          `codec.check`, and a run-time enum built inside its field instead
          of once before the `use` chain.
        - Flag a union `match` that returns a value tagged by another union.
        - Flag a codec stored with `term_to_binary` or kept across a hot code
          upgrade; root and step codecs are rebuilt.

    - path: "{src,examples/*/src,integrations/*/src}/**/*.gleam"
      instructions: |
        Telemetry (sinal). Apply to a module that imports `sinal`.
        - Flag an event name, field key or route prefix built from run-time
          input; they become atoms. Step names and run ids go in metadata
          values.
        - Flag an event defined twice instead of one definition shared by
          emitter and observer.
        - Flag a getter or encoder that can raise.
        - Flag an attachment never detached, and an unrouted handler that does
          I/O or other slow work.
        - Flag telemetry used to decide whether a step effect or checkpoint
          commit happened, and forwarding treated as lossless.
        - Flag correlation treated as trace parentage or authorization.

    - path: "{test,fixtures,examples/*/test,integrations/*/test}/**"
      instructions: |
        Tests (testing).
        - Flag a test that confirms success through internals, private state
          or a side channel where the public API can show it.
        - Flag a mock of an internal collaborator, and an assertion on call
          counts or call order. Probes and test stores stand in only for the
          true external.
        - Flag a scenario outcome that no design rule states.
        - Flag tests left in place for an interface the diff replaced.
        - Flag a refusal or illegal input the change introduces with no test
          through the public boundary, and a new opaque type with no
          fixtures/negative case.
        - Flag a scheduling, recovery or storage change with no case for
          duplicate delivery, reordering, timeout, retry, partial completion,
          restart or contention where the design states one.
        - Flag a storage behavior added without a case in the storage
          conformance suite, and adapter behavior tested without the real
          PostgreSQL engine.

    - path: "oracle/reactor/**/*.{ex,exs}"
      instructions: |
        Reactor oracle (elixir).
        - Flag behavior selected by a conditional in a body where matching in
          a function head does the job.
        - Flag a bare `nil` returned beside tagged results, and a rescue of an
          error the scenario cannot handle.
        - Flag an atom created from external input.
        - Flag an HTTP or model call in a scenario that does not replay a
          recorded response.

    - path: "{docs,integrations/*/docs}/{design,adr}/**"
      instructions: |
        Design layer (design; policy).
        - Fresh reader. The reviewer never saw the change being made. Flag a
          changed unit that does not tell a reader with no memory what the
          code does not say, and a unit that copies the code.
        - Flag content the code states: payloads, fields, limits, timeouts,
          retries, function or file lists, queries. Name the rule it serves
          instead; a file or symbol is allowed only where a reader needs it to
          find where a rule is enforced.
        - Flag session narration, progress notes, status or delivery history.
        - Flag a unit missing one of overview, interface, invariants, side
          effects and verification; an empty part says "none".
        - Flag a concept defined in a second home (the adapter layer defers
          Claim, Stored, Commit and recovery permission to the durability
          context), a glossary term with two meanings, and a retired term
          reused.
        - Flag an edit to an accepted ADR's text instead of a superseding ADR,
          and a changed date on a pending entry.

    - path: "issues/**/*.md"
      instructions: |
        Local tracker (tracker; AGENTS.md).
        - Each issue file under `issues/<feature>/issues/` carries one
          `Status:` and one `Category:` header with a value AGENTS.md lists.
        - Flag an issue titled with a solution instead of the observable
          problem, line numbers or solution code in an issue, and a horizontal
          task such as "build the data layer".
        - Flag an AI-written comment that does not start with
          `AI-assisted contribution.`

    - path: "{scripts/**,integrations/*/scripts/**,flake.nix,lefthook.yml,.github/workflows/**}"
      instructions: |
        Gate (gate).
        - Flag a check that passes or skips when its tool is missing
          (PostgreSQL, mix); it fails or reports unmeasured.
        - Flag a tool not supplied through the Nix flake, and a command that
          differs between local runs and CI.
        - Flag a new check that encodes a layout, naming or README
          convention, and a check that scripts what a tool already performs.
        - Flag a replaced check that drops security or data-integrity
          coverage, such as the durable restart check or the storage
          conformance suite.
        - Flag a gate that keeps a formatting check but loses the build with
          warnings as errors, `erlc -Werror` or the behavior tests of a
          package.
        - Flag a benchmark number turned into a gate (ADR 0011).

    - path: ".github/workflows/pr-title.yml"
      instructions: |
        Pull request title check (gate).
        - This file mirrors the shared title workflow. Flag a change that
          makes it differ from the shared copy: types, patterns, action pin,
          triggers or permissions.
        - It is the one convention CI checks, so do not flag it as a
          convention turned into a check.
        - Its tool is the pinned action in place of a flake tool, because the
          title exists on the pull request and never in a checkout.

  pre_merge_checks:
    title:
      mode: "off"
    description:
      mode: warning
    issue_assessment:
      mode: "off"
    docstrings:
      mode: "off"
    custom_checks:
      - name: No weakened test or gate
        mode: error
        instructions: |
          Source: policy, gate. Fail if the diff skips, deletes, disables or
          loosens a test, a fixtures/negative case or its `.expect`, a storage
          conformance case, an oracle scenario or expected trace, or a step of
          scripts/test.sh, the extended workflow or CI (including removing a
          package, `--warnings-as-errors`, `erlc -Werror`,
          scripts/check_negative.sh or scripts/check_durable_restart.sh from
          the gate, or adding `continue-on-error`), and the pull request
          description does not name the behavior that no longer exists or the
          stronger check that replaces it. A recomputed
          `oracle/differences/*.diff` needs the reviewed behavior change it
          records. Pass otherwise.
      - name: Behavior change carries its design
        mode: warning
        instructions: |
          Source: policy, design. Warn if the diff changes public behavior,
          an invariant, a durability or recovery rule in src/ or
          integrations/saga_postgres/src with no change under docs/design,
          docs/adr or the adapter's docs/design and docs/adr, and the pull
          request description does not say the change restores designed
          behavior or preserves behavior. Pass for tests, tooling and
          documentation-only changes.
      - name: Breaking change is declared
        mode: warning
        instructions: |
          Source: policy, gleam-lib. Consider only the published library
          source: src/ outside `saga/internal`, and
          integrations/saga_postgres/src outside `saga_postgres/internal`.
          Warn if the diff removes or changes an exported function, type,
          constructor, field or module path in that source, or a stored
          checkpoint or row format, and the pull request description does not
          call the change breaking and give its migration. Pass for changes to
          tests, examples, benchmarks and other files.
      - name: Public API change reaches the consumer
        mode: warning
        instructions: |
          Source: gleam-lib, AGENTS.md. Consider only src/ outside
          `saga/internal`; examples/order_consumer depends on saga alone, not
          on saga_postgres. Warn if the diff adds, removes or changes an
          exported function, type, constructor or field in that source and
          changes nothing under examples/order_consumer, and the pull request
          description does not say why no usage example covers it. Pass for
          changes to tests, examples, benchmarks and other files.
      - name: Problem-first description
        mode: warning
        instructions: |
          Source: git. Warn unless the pull request description gives the
          problem, why it matters, one concrete example, the solution in one
          paragraph, its trade-offs, and what was verified, with no file
          tour, and its claims match the diff.
      - name: No attribution text
        mode: warning
        instructions: |
          Source: git. Warn if the pull request title or description contains
          a co-author credit, `Co-Authored-By`, a "Generated with" or
          "Generated by" line, or a line starting with the robot emoji.

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false

  tools:
    gitleaks:
      enabled: true
    trufflehog:
      enabled: true
    actionlint:
      enabled: true
    zizmor:
      enabled: true
    shellcheck:
      enabled: true
    # The repository runs no Python, SQL, JavaScript, prose or YAML linter;
    # their findings would be preferences without a written rule (policy,
    # Silence).
    ruff:
      enabled: false
    flake8:
      enabled: false
    pylint:
      enabled: false
    sqlfluff:
      enabled: false
    squawk:
      enabled: false
    biome:
      enabled: false
    eslint:
      enabled: false
    oxc:
      enabled: false
    markdownlint:
      enabled: false
    languagetool:
      enabled: false
    vale:
      enabled: false
    yamllint:
      enabled: false
    github-checks:
      enabled: true

chat:
  auto_reply: true

knowledge_base:
  code_guidelines:
    enabled: true
    # AGENTS.md and CLAUDE.md are read by default.
    filePatterns:
      - files: "docs/COVERAGE.md,docs/CONTEXT-MAP.md,docs/design/**/*.typ,docs/adr/*.md"
        applyTo: "src/**,examples/**,test/**,bench/**,fixtures/**"
      - files: "integrations/saga_postgres/docs/COVERAGE.md,integrations/saga_postgres/docs/design/**/*.typ,integrations/saga_postgres/docs/adr/*.md"
        applyTo: "integrations/saga_postgres/**"
      - files: "docs/ORACLE.md"
        applyTo: "test/**,oracle/**"
  learnings:
    scope: local
  pull_requests:
    scope: local
