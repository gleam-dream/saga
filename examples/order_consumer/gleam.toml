name = "order_consumer"
version = "0.1.0"
target = "erlang"
gleam = ">= 1.18.0"
licenses = ["Apache-2.0"]
description = "External acceptance consumer for saga's public API: an order-checkout workflow written against only saga's public modules."

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
saga = { path = "../.." }
sinal = { path = "../../../sinal" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
json_blueprint = { path = "../../../json_blueprint" }
