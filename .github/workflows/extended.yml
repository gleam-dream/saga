name: Retained oracle and benchmark
on:
  push:
    paths: &relevant
      - "src/**"
      - "test/**"
      - "examples/**"
      - "fixtures/**"
      - "integrations/**"
      - "oracle/**"
      - "bench/**"
      - "scripts/**"
      - ".github/workflows/**"
      - "gleam.toml"
      - "manifest.toml"
      - "flake.*"
      - "docs/adr/0010-reactor-is-a-scoped-differential-oracle.md"
      - "THIRD-PARTY-NOTICES*"
  pull_request:
    paths: *relevant
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verification:
    name: Reactor oracle and measurements
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - name: Compare all seven scoped Reactor scenarios
        run: nix develop .#oracle --no-update-lock-file --command bash scripts/oracle.sh
