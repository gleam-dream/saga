name: Test
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: saga
      # gleam.toml files reach sinal and json_blueprint through ../ paths.
      - name: Read the pinned sibling revisions
        id: siblings
        run: |
          echo "sinal=$(grep '^sinal=' saga/sibling-revisions.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
          echo "json_blueprint=$(grep '^json_blueprint=' saga/sibling-revisions.txt | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: gleam-dream/sinal
          ref: ${{ steps.siblings.outputs.sinal }}
          path: sinal
      - uses: actions/checkout@v4
        with:
          repository: lostbean/json_blueprint
          ref: ${{ steps.siblings.outputs.json_blueprint }}
          path: json_blueprint
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "28"
          gleam-version: "1.18.1"
          rebar3-version: "3.27.0"
      - run: gleam deps download
        working-directory: saga
      - run: gleam format --check src test
        working-directory: saga
      - run: gleam build --warnings-as-errors
        working-directory: saga
      - run: gleam test
        working-directory: saga
      - run: gleam deps download
        working-directory: saga/examples/order_consumer
      - run: gleam format --check src test
        working-directory: saga/examples/order_consumer
      - run: gleam build --warnings-as-errors
        working-directory: saga/examples/order_consumer
      - run: gleam test
        working-directory: saga/examples/order_consumer
      - run: gleam run
        working-directory: saga/examples/order_consumer
      - run: scripts/check_negative.sh
        working-directory: saga
      - run: gleam deps download
        working-directory: saga/bench
      - run: gleam format --check src
        working-directory: saga/bench
      - run: gleam build --warnings-as-errors
        working-directory: saga/bench
      - run: scripts/check_durable_restart.sh
        working-directory: saga
      # The runner image ships PostgreSQL 16 binaries outside PATH; the test
      # script starts and removes its own throwaway cluster.
      - run: echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
      - run: gleam deps download
        working-directory: saga/integrations/saga_postgres
      - run: gleam format --check src test
        working-directory: saga/integrations/saga_postgres
      - run: gleam build --warnings-as-errors
        working-directory: saga/integrations/saga_postgres
      - run: scripts/test-postgres.sh
        working-directory: saga/integrations/saga_postgres

  design:
    name: Design layer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: experimental-features = nix-command flakes
      - run: nix run .#design-gate-check -- docs/design . --nested-project integrations/saga_postgres
