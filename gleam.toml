name = "saga"
version = "0.2.0"
target = "erlang"
gleam = ">= 1.18.0"
internal_modules = ["saga/internal", "saga/internal/*"]
licenses = ["Apache-2.0"]
description = "A strongly-typed saga/DAG orchestrator for Gleam: typed dependency graphs instead of dynamic step maps."
repository = { type = "github", user = "gleam-dream", repo = "saga" }

[erlang]
# A local run draws its idempotency key scope from `crypto`.
extra_applications = ["crypto"]

[dependencies]
gleam_stdlib = ">= 0.70.0 and < 2.0.0"
gleam_erlang = ">= 1.0.0 and < 2.0.0"
gleam_otp = ">= 1.0.0 and < 2.0.0"
gleam_json = ">= 3.0.0 and < 4.0.0"
gleam_time = ">= 1.11.0 and < 2.0.0"
# Sinal is required: the coordinator emits saga/telemetry events on every
# run. Pinned to Sinal's unreleased redesign until its next Hex release.
sinal = { git = "https://github.com/gleam-dream/sinal.git", ref = "29ea7a90bf820b3c91eb3f76e824abe0d034d78f" }

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"
